<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeerFactory — ведущий</title><link rel="stylesheet" href="/styles.css"></head><body>
<main id="lock" class="wrap host-lock"><section class="card display-card"><div class="eyebrow">BeerFactory Game</div><h1 style="font-size:48px;margin:12px 0 18px">Панель ведущего</h1><p class="muted">Введите PIN. Он задаётся на сервере через <b>HOST_PIN</b>.</p><form id="pinForm"><input id="pin" class="input" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required><button class="btn primary" style="width:100%;margin-top:12px">Войти</button></form><div id="pinError" class="bad small" style="margin-top:10px"></div></section></main>
<main id="hostApp" class="wrap hidden"><div class="top"><div><div class="brand">Beer<span>Factory</span> Game</div><div class="muted">Пульт ведущего</div></div><div class="row"><a class="btn" href="/join" target="_blank">Общий вход</a><a class="btn" href="/screen" target="_blank">Открыть экран</a><button id="logout" class="btn ghost">Выйти</button></div></div>
<div class="grid grid2"><section class="card"><div class="row spread"><div><div class="eyebrow">Команды</div><h2 style="margin:5px 0 0">Участники</h2></div><span id="teamCount" class="pill"></span></div><form id="addTeam" class="row" style="margin:16px 0"><input id="teamName" class="input" placeholder="Название новой команды" maxlength="40" required><button class="btn primary">Добавить</button></form><div id="teams"></div></section>
<section class="card display-card"><div class="eyebrow">Управление</div><h2 style="margin:5px 0 16px">Текущий раунд</h2><label class="muted small">Вопрос</label><select id="questionSelect" class="select"></select><div id="roundInfo" style="margin:16px 0"></div><div class="row"><button id="startBtn" class="btn primary">Запустить</button><button id="nextBtn" class="btn primary">Следующий вопрос</button><button id="closeBtn" class="btn">Закрыть</button><button id="revealBtn" class="btn">Показать ответ</button><button id="clearBtn" class="btn">В ожидание</button></div><div id="message" class="notice hidden" style="margin-top:14px"></div><div class="join-box" style="margin-top:18px"><img class="qr-large" style="width:120px" src="/api/join-qr.svg" alt="Общий QR"><div><b>Общий QR</b><div class="muted small">Гость выбирает команду из списка. У команд также остаются свои отдельные QR.</div></div></div></section></div>
<section class="card" style="margin-top:16px"><div class="row spread"><div><div class="eyebrow">Счёт</div><h2 style="margin:5px 0 0">Таблица команд</h2></div><button id="resetScores" class="btn danger">Сбросить очки</button></div><div id="standings"></div></section></main>
<script src="/socket.io/socket.io.js"></script><script type="module" src="/host.js"></script></body></html>
