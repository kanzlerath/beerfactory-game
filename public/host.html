<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeerFactory — ведущий</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="top"><div><div class="brand">Beer<span>Factory</span> Game</div><div class="muted">Панель ведущего</div></div><a class="btn" href="/screen" target="_blank">Открыть экран</a></div><div class="grid grid2"><section class="card"><div class="row spread"><h2>Команды</h2><span id="teamCount" class="pill"></span></div><form id="addTeam" class="row"><input id="teamName" class="input" placeholder="Название команды" maxlength="40" required><button class="btn primary">Добавить</button></form><div id="teams"></div></section><section class="card"><h2>Раунд</h2><label class="muted small">Вопрос</label><select id="questionSelect" class="select"></select><div id="roundInfo" style="margin:16px 0"></div><div class="row"><button id="startBtn" class="btn primary">Запустить вопрос</button><button id="closeBtn" class="btn">Закрыть</button><button id="revealBtn" class="btn">Показать ответ</button><button id="clearBtn" class="btn">Убрать с экрана</button></div><div id="message" class="notice hidden" style="margin-top:14px"></div></section></div><section class="card" style="margin-top:16px"><div class="row spread"><h2>Таблица</h2><button id="resetScores" class="btn danger">Сбросить очки</button></div><div id="standings"></div></section></main><script src="/socket.io/socket.io.js"></script><script type="module" src="/host.js"></script></body></html>
